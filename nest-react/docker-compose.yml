services:
  postgres:
   image: postgres
   container_name: postgres-invoice
   environment: 
    POSTGRES_PASSWORD: 123456
    POSTGRES_USER: postgres
    POSTGRES_DB: db_invoice
   ports:
    - "5434:5432"
   volumes:
    - postgres-nest:/var/lib/postgresql/data
   networks:
    - invoice-network
  backend:
   build:
    context: ./invoice-service
    dockerfile: Dockerfile
   container_name: invoice-service
   ports:
    - "3000:3000"
   depends_on:
    - postgres
   networks:
    - invoice-network
  frontend:
   build:
    context: ./invoice-frontend
    dockerfile: Dockerfile
   container_name: invoice-frontend
   ports:
    - "3100:3100"
   depends_on:
    - backend
   networks:
    - invoice-network
networks:
 invoice-network:
volumes:
  postgres-nest:
  