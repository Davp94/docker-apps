services:
  postgres:
   image: postgres
   container_name: postgres-hospital
   restart: always
   environment: 
    POSTGRES_PASSWORD: 123456
    POSTGRES_USER: postgres
    POSTGRES_DB: hospital_db
   ports:
    - "5432"
   volumes:
    - postgres-final:/var/lib/postgresql/data
   networks:
    - hospital-network
  backend:
   build:
    context: ./hospital-service/
    dockerfile: Dockerfile
   container_name: hospital-service
   restart: always
   healthcheck:
     test: ["CMD","curl","-f","http://54.227.97.186:9700/"]
     interval: 20s
     timeout: 10s
     retries: 3
   env_file:
    - .env 
   ports:
    - "9700:9700"
   depends_on:
    - postgres
   networks:
    - hospital-network
  frontend:
   build:
    context: ./hospital-frontend
    dockerfile: Dockerfile
   container_name: hospital-frontend
   restart: always
   ports:
    - "4200:4200"
   depends_on:
    - backend
   networks:
    - hospital-network
networks:
 hospital-network:
volumes:
  postgres-final:
  